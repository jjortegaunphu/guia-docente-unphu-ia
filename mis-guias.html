<!DOCTYPE html>
<html lang="es">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Mis Guías Finalizadas | Guía Docente UNPHU IA
  </title>

  <style>

    :root {
      --verde-unphu: #006b54;
      --verde-oscuro: #004c3f;
      --verde-claro: #e9f4f1;
      --blanco: #ffffff;
      --gris-fondo: #f5f7f7;
      --gris-texto: #4b5563;
      --texto: #1f2937;
    }


    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }


    body {
      font-family:
        Arial,
        Helvetica,
        sans-serif;

      background:
        var(--gris-fondo);

      color:
        var(--texto);

      min-height: 100vh;
    }


    /* ENCABEZADO */

    header {

      background:
        linear-gradient(
          135deg,
          var(--verde-oscuro),
          var(--verde-unphu)
        );

      color:
        var(--blanco);

      padding:
        20px 8%;
    }


    .header-content {

      max-width:
        1200px;

      margin:
        auto;
    }


    .header-main {

      display:
        flex;

      align-items:
        center;

      gap:
        24px;
    }


    .logo-unphu {

      width:
        190px;

      height:
        auto;

      background:
        var(--blanco);

      padding:
        8px 10px;

      border-radius:
        6px;

      flex-shrink:
        0;
    }


    .header-text {

      border-left:
        1px solid
        rgba(
          255,
          255,
          255,
          0.45
        );

      padding-left:
        24px;
    }


    header h1 {

      font-size:
        30px;

      margin-bottom:
        6px;
    }


    header p {

      font-size:
        16px;

      opacity:
        0.95;
    }


    /* CONTENIDO */

    main {

      max-width:
        1100px;

      margin:
        auto;

      padding:
        55px 25px;
    }


    .barra-superior {

      margin-bottom:
        30px;
    }


    .volver {

      color:
        var(--verde-unphu);

      text-decoration:
        none;

      font-weight:
        bold;
    }


    .volver:hover {

      text-decoration:
        underline;
    }


    .titulo-seccion {

      margin-bottom:
        32px;
    }


    .titulo-seccion h2 {

      color:
        var(--verde-oscuro);

      font-size:
        28px;

      margin-bottom:
        10px;
    }


    .titulo-seccion p {

      color:
        var(--gris-texto);

      line-height:
        1.6;
    }


    /* LISTA DE GUÍAS */

    .lista-guias {

      display:
        grid;

      gap:
        20px;
    }


    .guia-card {

      background:
        var(--blanco);

      border:
        1px solid #e1e7e5;

      border-radius:
        14px;

      padding:
        26px;

      box-shadow:
        0 6px 18px
        rgba(
          0,
          76,
          63,
          0.07
        );
    }


    .guia-card h3 {

      color:
        var(--verde-oscuro);

      margin-bottom:
        14px;

      font-size:
        21px;
    }


    .guia-card p {

      color:
        var(--gris-texto);

      margin-bottom:
        8px;

      line-height:
        1.5;
    }


    .estado {

      display:
        inline-block;

      margin-top:
        8px;

      padding:
        6px 10px;

      background:
        var(--verde-claro);

      color:
        var(--verde-oscuro);

      border-radius:
        6px;

      font-size:
        13px;

      font-weight:
        bold;
    }


    .sin-guias {

      background:
        var(--blanco);

      border:
        1px solid #e1e7e5;

      border-radius:
        14px;

      padding:
        35px;

      text-align:
        center;

      color:
        var(--gris-texto);
    }


    /* PIE */

    footer {

      text-align:
        center;

      color:
        #6b7280;

      font-size:
        13px;

      padding:
        30px 20px;
    }


    /* CELULARES */

    @media (max-width: 750px) {

      .header-main {

        flex-direction:
          column;

        align-items:
          flex-start;

        gap:
          16px;
      }


      .header-text {

        border-left:
          none;

        padding-left:
          0;
      }


      .logo-unphu {

        width:
          165px;
      }


      header h1 {

        font-size:
          25px;
      }

    }

  </style>

</head>


<body>


  <header>

    <div class="header-content">

      <div class="header-main">

        <img
          src="logo-unphu.png"
          alt="Universidad Nacional Pedro Henríquez Ureña"
          class="logo-unphu"
        >

        <div class="header-text">

          <h1>
            Guía Docente UNPHU IA
          </h1>

          <p>
            Guías docentes finalizadas
          </p>

        </div>

      </div>

    </div>

  </header>


  <main>


    <div class="barra-superior">

      <a
        href="index.html"
        class="volver"
      >
        ← Volver al inicio
      </a>

    </div>


    <section class="titulo-seccion">

      <h2>
        Mis guías finalizadas
      </h2>

      <p>
        Consulta las Guías Docentes que han sido
        revisadas y finalizadas.
      </p>

    </section>

<section
  id="listaGuias"
  class="lista-guias"
>
</section>


<section
  id="detalleGuia"
  style="display: none;"
>
</section>


</main>



  <footer>

    Guía Docente UNPHU IA ·
    Herramienta de apoyo académico

  </footer>


  <script>


    function obtenerGuiasFinalizadas(){

      try {

        const guardadas =
          localStorage.getItem(
            "guiasDocentesFinalizadas"
          );


        if(!guardadas){
          return [];
        }


        const guias =
          JSON.parse(
            guardadas
          );


        return Array.isArray(guias)
          ? guias
          : [];

      }
      catch(error){

        console.error(
          "No fue posible recuperar las guías finalizadas:",
          error
        );

        return [];

      }

    }



    function formatearFecha(fecha){

      if(!fecha){
        return "Fecha no disponible";
      }


      const fechaObjeto =
        new Date(fecha);


      if(
        Number.isNaN(
          fechaObjeto.getTime()
        )
      ){
        return "Fecha no disponible";
      }


      return fechaObjeto
        .toLocaleString(
          "es-DO",
          {
            dateStyle:
              "long",

            timeStyle:
              "short"
          }
        );

    }

function abrirGuiaFinalizada(idGuia){

  const guias =
    obtenerGuiasFinalizadas();


  const guiaSeleccionada =
    guias.find(
      guia =>
        guia?.id === idGuia
    );


  if(
    !guiaSeleccionada ||
    !guiaSeleccionada.datosGuia
  ){

    alert(
      "No fue posible localizar la Guía Docente seleccionada."
    );

    return;

  }


  const datos =
    guiaSeleccionada.datosGuia;


  const asignatura =
    datos
      ?.instrumentosEvaluacion
      ?.fuente
      ?.asignatura;


  const nombreAsignatura =
    asignatura?.nombre ||
    datos
      ?.configuracion
      ?.nombreAsignatura ||
    "Guía Docente";


  const codigoAsignatura =
    asignatura?.codigo ||
    datos
      ?.configuracion
      ?.codigoAsignatura ||
    "No disponible";


  const cronograma =
    Array.isArray(
      datos?.cronograma
    )
      ? datos.cronograma
      : [];


  const rubros =
  datos
    ?.instrumentosEvaluacion
    ?.fuente
    ?.sistemaEvaluacion
    ?.rubrosAceptados ||
  [];


  const instrumentos =
    datos
      ?.instrumentosEvaluacion
      ?.elaborados ||
    [];


  const detalle =
    document.getElementById(
      "detalleGuia"
    );


  const lista =
    document.getElementById(
      "listaGuias"
    );


  lista.style.display =
    "none";


  detalle.style.display =
    "block";


  detalle.innerHTML = `

    <article class="guia-card">

      <button
        type="button"
        id="btnVolverListado"
        style="
          background: transparent;
          color: #006b54;
          border: none;
          padding: 0;
          margin-bottom: 24px;
          font-weight: 700;
          cursor: pointer;
        "
      >
        ← Volver a Mis guías
      </button>


      <h2
        style="
          color: #004c3f;
          margin-bottom: 12px;
        "
      >
        ${nombreAsignatura}
      </h2>


      <p>
        <strong>Código:</strong>
        ${codigoAsignatura}
      </p>


      <p>
        <strong>Finalizada:</strong>
        ${formatearFecha(
          guiaSeleccionada.fechaFinalizacion
        )}
      </p>


      <hr
        style="
          margin: 24px 0;
          border: 0;
          border-top: 1px solid #e1e7e5;
        "
      >


      <h3>
        Resumen de la Guía Docente
      </h3>


      <p>
        <strong>Semanas del cronograma:</strong>
        ${cronograma.length}
      </p>


      <p>
        <strong>Rubros de evaluación:</strong>
        ${rubros.length}
      </p>


      <p>
        <strong>Instrumentos elaborados:</strong>
        ${instrumentos.length}
      </p>

    </article>

  `;


  document
    .getElementById(
      "btnVolverListado"
    )
    .addEventListener(
      "click",
      function(){

        detalle.style.display =
          "none";

        detalle.innerHTML =
          "";

        lista.style.display =
          "grid";

      }
    );

}

    function mostrarGuiasFinalizadas(){

      const contenedor =
        document.getElementById(
          "listaGuias"
        );


      const guias =
        obtenerGuiasFinalizadas();


      if(guias.length === 0){

        contenedor.innerHTML = `

          <div class="sin-guias">

            <p>
              Todavía no hay Guías Docentes
              finalizadas.
            </p>

          </div>

        `;

        return;

      }


      contenedor.innerHTML = "";


      const guiasOrdenadas =
        [...guias].sort(
          (a, b) =>
            new Date(
              b.fechaFinalizacion || 0
            ) -
            new Date(
              a.fechaFinalizacion || 0
            )
        );


      guiasOrdenadas.forEach(
        guia => {


          const datos =
            guia?.datosGuia || {};


          const asignatura =
            datos
              ?.instrumentosEvaluacion
              ?.fuente
              ?.asignatura;


          const nombreAsignatura =
            asignatura?.nombre ||
            datos
              ?.configuracion
              ?.nombreAsignatura ||
            "Guía Docente";


          const codigoAsignatura =
            asignatura?.codigo ||
            datos
              ?.configuracion
              ?.codigoAsignatura ||
            "No disponible";


          const tarjeta =
            document.createElement(
              "article"
            );


          tarjeta.className =
            "guia-card";


          const titulo =
            document.createElement(
              "h3"
            );


          titulo.textContent =
            nombreAsignatura;


          const codigo =
            document.createElement(
              "p"
            );


          codigo.textContent =
            "Código: " +
            codigoAsignatura;


          const fecha =
            document.createElement(
              "p"
            );


          fecha.textContent =
            "Finalizada: " +
            formatearFecha(
              guia.fechaFinalizacion
            );


          const estado =
            document.createElement(
              "span"
            );


          estado.className =
            "estado";


          estado.textContent =
            "Finalizada";

          const acciones =
  document.createElement(
    "div"
  );


acciones.style.marginTop =
  "20px";


const btnAbrir =
  document.createElement(
    "button"
  );


btnAbrir.type =
  "button";


btnAbrir.textContent =
  "Abrir guía";


btnAbrir.className =
  "button";

btnAbrir.style.background =
  "#006B54";

btnAbrir.style.color =
  "#ffffff";

btnAbrir.style.border =
  "none";

btnAbrir.style.borderRadius =
  "8px";

btnAbrir.style.padding =
  "10px 18px";

btnAbrir.style.fontSize =
  "14px";

btnAbrir.style.fontWeight =
  "600";

btnAbrir.style.cursor =
  "pointer";

btnAbrir.style.textDecoration =
  "none";


btnAbrir.addEventListener(
  "click",
  function(){

    abrirGuiaFinalizada(
      guia.id
    );

  }
);


acciones.appendChild(
  btnAbrir
);


          tarjeta.appendChild(
            titulo
          );


          tarjeta.appendChild(
            codigo
          );


          tarjeta.appendChild(
            fecha
          );


          tarjeta.appendChild(
            estado
          );

          tarjeta.appendChild(
           acciones
          );


          contenedor.appendChild(
            tarjeta
          );

        }
      );

    }



    document.addEventListener(
      "DOMContentLoaded",
      mostrarGuiasFinalizadas
    );


  </script>


</body>

</html>
